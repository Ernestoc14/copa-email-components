    }

      font-style: normal;
      font-display: swap;
      font-weight: 700;

    }

    @font-face {
      font-family: Gilroy;
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: local('GilroyRegular'), local('Gilroy-Regular'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-regular-webfont.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-regular-webfont.woff2) format('woff2');
    }

    @font-face {
      font-family: Gilroy;
      font-style: normal;
      font-display: swap;
      font-weight: 700;
      src: local('GilroyBold'), local('Gilroy-Bold'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-bold-webfont.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-bold-webfont.woff2) format('woff2');
    }

    body {
      background: #F5F5F5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    *[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }

    table,
    td {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
  </style>
  <!-- Media Queries -->
  <style type="text/css">
    @media all and (max-width:719px) {
      .mobile-block {
        display: block !important;
      }

      .card-logo {
        margin-right: 0 !important;
      }

      .date-cell {
        width: auto !important;
      }

      .destino-img-remove {
        display: none;
      }

      .infobar-divider-remove {
        display: none;
      }

      .reorder-mobile-table {
        display: block !important;
        width: 375px !important;
      }

      .reorder-mid {
        display: block !important;
      }

      .info-mobile-padding {
        padding-bottom: 24px;
      }
      .mid-right-spacing {
        padding-right: 56px;
      }
    }
  </style>
  <!-- CSS General Classes -->
  <style type="text/css">
    .title-info-flight {
      font-weight: 400;
      font-size: 14px;
      color: #FFFFFF;
      font-family: SuisseIntl, Helvetica, Arial, sans-serif;
      margin: 0;
      margin-bottom: 5px;
    }

    .subtitle-info-flight {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      font-family: Gilroy, Helvetica, Arial, sans-serif;
      margin: 0;
    }
  </style>

  <table class="email-wrapper" align="center" border="0" cellpadding="0" cellspacing="0"
    style="padding: 5px 0 0 0;max-width: 800px;">
    <tr>
      <td>
        <!-- Start Header Wrapper Blue BG -->
        <table border="0" cellpadding="0" cellspacing="0"
          style="background-color: #0032A0; border-top-left-radius: 8px; border-top-right-radius: 8px;">
          <tr>
            <td>
              <!-- Start Header Logo -->
              <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;min-width:100%;">
                <tr>
                  <td class="header-logo-padding" style="padding: 32px 32px 0;">
                    <!-- Start Replace Header Component -->
                    <table border="0" cellpadding="0" cellspacing="0" style="width: 100%; ">
                      <tbody>
                        <tr>
                          <td style="width: 100%; height:40px;">
                            <img height="auto" src="https://www.copaair.com/webassets/images/copa-logo-white.png"
                              style="border: 0;display: block;outline: none;text-decoration: none;width: 176px;height: auto;line-height: 100%;"
                              alt="Copa Logo" class="copa-logo-width" width="176">
                          </td>
                        </tr>
                        <tr>
                          <td class="divider-mobile-spacing"
                              style="border-bottom: 1px solid #cccccb; padding-top: 22px; width: 100%; max-height: 1px; height: 1px;line-height: 0;">
                              &nbsp;
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <!-- End Replace Header Component -->
                  </td>
                </tr>
              </table>
              <!-- End Header Logo -->
              <!-- Start Header Info -->
              <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;min-width:100%;">
                <tr>
                  <!-- Fix en este Padding para spacing interno del componente (Title Box - Prep email) -->
                  <td class="mobile-padding" style="background-color: #0032A0; padding: 0 32px">
                    <!-- Start Replace Header Info Component -->
                    <table border="0" cellpadding="0" cellspacing="0" style="width:100%; color: #FFFFFF;">
                      <tr>
                        <td class="titlebox-remove-mbpadding" style="width: 100%; padding: 0 40px;">
                          <table border="0" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="word-break: break-word; padding: 48px 0 24px; height: 60px;"
                                class="titlebox-mobile-padding">
                                <p class="title-titlebox-mobile" 
                                style="font-family: Gilroy, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 32px; line-height: 40px; margin: 0; white-space: nowrap;">
                                  Disfruta nuestra experiencia abordo
                                </p>
                                <p style=" font-family: SuisseIntl, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; line-height: 24px; margin: 0; white-space: nowrap; padding-top: 8px;">
                                  Conoce la comida y opciones de entretenimiento que te esperan durante tu viaje
                                </p>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td class="titlebox-remove-mbpadding" style="width: 100%; padding: 0 40px;">
                          <table align="left" border="0" cellpadding="0" cellspacing="0" style="width: 100%;">
                            <tr>
                              <td class="reorder-mobile-table xsmall-reorder">
                                <table border="0" cellpadding="0" cellspacing="0" class="info-mobile-padding">
                                  <tr>
                                    <td style="padding-right: 16px;" class="destino-img-remove">
                                      <!--[if mso]>
                                          <v:oval xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" style="display:inline-block;text-decoration:none;color:#333333;border-radius:50%;width:55px;height:56px" strokecolor="#ffffff" strokeweight="1pt">
                                            <v:fill color="#0032A0" />
                                          </v:oval>
                                      <![endif]-->
                                      <!--[if mso]>
                                        <v:rect stroked="f" filled="false" style="position:absolute; top:-3.1px; left:-8.3px; width:100%;">
                                      <![endif]-->
                                      <div
                                        style="border: 1px solid #0032A0;width: 52px;height: 52px;border-radius: 50%;padding: 1px;margin: 0 auto;"
                                        class="no-border">
                                        <!--Change the "JFK" below with the IAT Code of the destination in uppercase-->
                                        <img src="https://www.copaair.com/webassets/images/destinos/circulados/JFK.png" width="52"
                                          height="52" border="0" style="border:0;">
                                      </div>
                                      <!--[if mso]>
                                        </v:rect>
                                      <![endif]-->
                                    </td>
                                    <td class="info-mobile-padding">
                                      <p class="title-info-flight">
                                        Destination:
                                      </p>
                                      <p class="subtitle-info-flight" style="white-space: nowrap;">
                                        Santiago de los Caballeros
                                      </p>
                                    </td>
                                  </tr>
                                </table>
                              </td>
                              <td class="reorder-mobile-table">
                                <table border="0" cellpadding="0" cellspacing="0">
                                  <tr>
                                    <td style="padding: 0 32px; width: 1px;" class="infobar-divider-remove">
                                      <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                        <tr>
                                          <td style="border-right: 1px solid #CCCCCB;width: 1px;height: 24px;">
                                            &nbsp;
                                          </td>
                                        </tr>
                                      </table>
                                    </td>
                                    <td class="xsmall-reorder mid-right-spacing info-mobile-padding">
                                      <p class="title-info-flight">
                                        Date:
                                      </p>
                                      <p id="fDate" class="subtitle-info-flight" style="white-space: nowrap;">
                                        Mar&nbsp;&#8203;,18&nbsp;&#8203;Sep
                                      </p>
                                    </td>
                                    <td style="padding: 0 32px; width: 1px;" class="infobar-divider-remove">
                                      <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                        <tr>
                                          <td style="border-right: 1px solid #CCCCCB;width: 1px;height: 24px;">
                                            &nbsp;
                                          </td>
                                        </tr>
                                      </table>
                                    </td>
                                    <td class="xsmall-reorder info-mobile-padding">
                                      <p class="title-info-flight" style="white-space: nowrap;">
                                        Codigo de reserva:
                                      </p>
                                      <p class="subtitle-info-flight">
                                        EBXGHT
                                      </p>
                                    </td>
                                  </tr>
                                </table>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                    <!-- End Replace Header Info Component -->
                  </td>
                </tr>
              </table>
              <!-- End Header Info -->
            </td>
          </tr>
        </table>
        <!-- End Wrapper Header Blue BG -->
        <!-- Start Body White BG -->
        <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;min-width:100%;">
          <tr>
            <td style="padding: 32px 0;">
              <!-- Start Replace Body -->
              <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;min-width:100%;">
                <tr>
                  <td class="mobile-padding" style="padding: 0 48px">
                    Body Section Tomara tamano del Children
                  </td>
                </tr>
              </table>
              <!-- End Replace Body -->
            </td>
          </tr>
        </table>
        <!-- End Body White BG  -->
        <!-- Start Footer -->
        <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;min-width:100%;">
          <tr>
            <td
              style="padding: 32px 0;background-color:#EFEFEE; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
              <!-- Start Replace Footer -->
              <table align="center" border="0" cellpadding="0" cellspacing="0" style="width:100%;min-width:100%;">
                <tr>
                  <td class="mobile-padding" style="padding: 0 48px">
                    Footer Section Tomara tamano del Children
                  </td>
                </tr>
              </table>
              <!-- End Replace Footer -->
            </td>
          </tr>
        </table>
        <!-- End Footer -->
      </td>
