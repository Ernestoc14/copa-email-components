<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <title></title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <meta name="x-apple-disable-message-reformatting">

    <xml>

  <style type="text/css">
    @font-face {
      font-family: SuisseIntl;
      font-style: normal;
      font-display: swap;
      font-weight: 300;
      src: local('SuisseIntlLight'), local('SuisseIntl-Light'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-Light-WebS.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-Light-WebS.woff2) format('woff2');
    }

    @font-face {
      font-family: SuisseIntl;
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: local('SuisseIntlRegular'), local('SuisseIntl-Regular'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-Regular-WebS.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-Regular-WebS.woff2) format('woff2');
    }

    @font-face {
      font-family: SuisseIntl;
      font-style: normal;
      font-display: swap;
      font-weight: 500;
      src: local('SuisseIntlMedium'), local('SuisseIntl-Medium'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-Medium-WebS.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-Medium-WebS.woff2) format('woff2');
    }

    @font-face {
      font-family: SuisseIntl;
      font-style: normal;
      font-display: swap;
      font-weight: 600;
      src: local('SuisseIntlSemiBold'), local('SuisseIntl-SemiBold'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-SemiBold-WebS.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/suisse/SuisseIntl-SemiBold-WebS.woff2) format('woff2');
    }

    @font-face {
      font-family: Gilroy;
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: local('GilroyRegular'), local('Gilroy-Regular'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-regular-webfont.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-regular-webfont.woff2) format('woff2');
    }

    @font-face {
      font-family: Gilroy;
      font-style: normal;
      font-display: swap;
      font-weight: 700;
      src: local('GilroyBold'), local('Gilroy-Bold'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-bold-webfont.woff) format('woff'), url(https://www.copaair.com/webassets/fonts/gilroy/gilroy-bold-webfont.woff2) format('woff2');
    }
  </style>

  <style type="text/css">
    body {
      background: #F5F5F5;
    }

    table,
    td {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    p {
      margin: 0;
    }

    th {
      text-align: left !important;
    }

    *[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: inherit !important;
    }
  </style>
  <style type="text/css">
    body {
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
  <style type="text/css">
    @media all and (max-width:719px) {
      .banner-block {
        display: block !important;
      }

      .banner-block-padding {
        padding: 32px 32px 16px !important;
      }
      .banner-paddings {
        padding: 0 !important;
      }
      .banner-paddings-1 {
        padding: 8px 0px 16px !important;
      }
      .store-container {
        text-align: center;
        padding: 0px !important;
      }
      .img-stores {
        width: 87px !important;
      }
      .store-padding-image{
        padding: 0 8px 0 0 !important;
      }
      .phone-img{
      padding: 0 22px !important;
      }
      .frame-cell-desktop {
        display: none;
        border-bottom-right-radius: 0;
      }
      .frame-cell-mobile {
        display: block !important;
        width: 100% !important; 
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
      }
    }
  </style>
  <style type="text/css">
  </style>

</head>

<body style="font-family: 'Poppins', Arial, sans-serif; margin: 0; border: 0; padding: 0;">
  <table cellpadding="0" cellspacing="0" border="0"
    style="margin: 0; width: 100%; background-color: #FFFFFF; border-collapse: collapse;">
    <tr>
      <td style="padding: 15px 72px;">
        <!-- Start Banner Component -->
        <!-- Copy this code into Master Container -->
        <table border="0" cellpadding="0" cellspacing="0" style="width:100%; border-collapse: separate;">
          <tr>
            <td style="line-height: 0; background-color:#FFFFFF; border-radius: 4px; border: 1px solid #DBDAD8;">
              <table border="0" cellpadding="0" cellspacing="0" style="vertical-align: middle;" width="100%">
                <tr>
                  <td class="banner-block banner-block-padding">
                    <table cellpadding="0" cellspacing="0" style="border-collapse:collapse;width:100%;">
                      <tr>
                        <td class="banner-paddings" style="padding:24px 32px 0 32px;color: #0032A0;font-family: Gilroy, Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;font-weight:700;">
                          Download the Copa Airlines mobile app
                        </td>
                      </tr>
                      <tr>
                        <td class="banner-paddings-1" style="font-size: 14px;font-style: normal;font-weight: 400;line-height: 20px;color: #666666;padding: 8px 32px 16px 32px">
                          Receive instant notifications about last minute flight departure changes,
                          gate changes and more.
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:0 32px 36px 32px" class="store-container banner-paddings">
                          <table class="store-table" style="border-collapse: collapse;text-align:center;width:100%">
                            <tr>
                              <td style="width:87px;padding: 0 16px 0 0;" class="store-padding-image">
                                <a href="https://apps.apple.com/es/app/copa-airlines/id533700785"
                                  target="_blank" style="text-decoration: none;">
                                  <img src="https://www.copaair.com/assets/app-store-2X.png"
                                    alt="Apple Store" width="87"
                                    style="width: 87px;margin: 0;border: 0;height: auto;line-height: 100%;outline: none;text-decoration: none;"
                                    class="img-stores">
                                </a>
                              </td>
                              <td style="width:87px;padding: 0 16px 0 0;" class="store-padding-image">
                                <a href="https://play.google.com/store/apps/details?id=com.mttnow.android.copa.production&hl=es"
                                  target="_blank" style="text-decoration: none;">
                                  <img src="https://www.copaair.com/assets/play-store-2X.png"
                                    alt="Google Play" width="87"
                                    style="width: 87px;margin: 0;border: 0;height: auto;line-height: 100%;outline: none;text-decoration: none;"
                                    class="img-stores">
                                </a>
                              </td>
                              <td style="padding: 0;text-align:left">
                                <a href="https://appgallery.huawei.com/app/C102348393" target="_blank"
                                  style="text-decoration: none;">
                                  <img src="https://www.copaair.com/assets/app-gallery-2X.png"
                                    alt="AppGallery" width="87"
                                    style="width: 87px;margin: 0;border: 0;height: auto;line-height: 100%;outline: none;text-decoration: none;"
                                    class="img-stores">
                                </a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td class="banner-block phone-img" valign="bottom" align="center"
                    style="vertical-align:bottom;padding:0;padding-right: 19px;">
                    <img
                      src="https://www.copaair.com/webassets/images/notifications/gate-banner-phone-desktop-es.png"
                      style="width: 214px;" width="214" class="frame-cell-desktop">
                    <!--[if !mso]><!-->
                    <img
                      src="https://www.copaair.com/webassets/images/notifications/gate-banner-phone-mobile-es.png"
                      style="display: none;" width="279" class="frame-cell-mobile">
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <!-- End Banner Component -->
      </td>
    </tr>
  </table>
</body>

</html>
